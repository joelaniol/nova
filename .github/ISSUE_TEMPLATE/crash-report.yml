name: Crash report · Absturz melden
description: Nova closed unexpectedly. Wrong results and slow steps go to the bug report form.
title: "[Crash] "
body:
  - type: markdown
    attributes:
      value: |
        For crashes only - Nova closed unexpectedly. Wrong MCP results, broken features and performance regressions: use the **Bug report** form. Experiences from a work session: **Work-session feedback**. · Nur für Abstürze. Falsche Ergebnisse und Performance-Probleme: Formular **Bug report**.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? · Was ist passiert?
      description: What were you doing when Nova crashed? · Was hast du gemacht, als Nova abstürzte?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce · Schritte zum Reproduzieren
      description: If you can reproduce it, list the steps. · Falls reproduzierbar, die Schritte.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Nova version · Nova-Version
      description: "Settings → About / Einstellungen → Info (e.g. 1.0.0-alpha.11)"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: "e.g. Windows 11 23H2 / Windows 10 22H2"
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: "Settings → About → Open app logs; attach the latest app-*.log if possible."
    validations:
      required: false
